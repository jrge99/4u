<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4U Management Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;font-weight:300;background:#fff;color:#0f1117;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.wrap{text-align:center;padding:40px 24px}
.logo{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,6vw,56px);font-weight:400;letter-spacing:-0.5px;color:#0f1117;margin-bottom:20px}
.logo span{color:#40c074}
.divider{width:40px;height:1px;background:#e5e7eb;margin:0 auto 20px}
.tagline{font-size:16px;color:#6b7280;font-weight:300;margin-bottom:28px;letter-spacing:0.2px}
.email{font-size:14px;color:#6b7280;font-weight:300}
.email a{color:#0f1117;text-decoration:none;border-bottom:1px solid #e5e7eb;padding-bottom:1px;transition:border-color .15s}
.email a:hover{border-color:#0f1117}

.cursor{display:inline-block;color:#40c074;animation:blink .7s step-end infinite;font-weight:300}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">4<span>U</span> Management Group</div>
  <div class="divider"></div>
  <p class="tagline"><span id="typewriter"></span><span class="cursor">|</span></p>
  <p class="email">For inquiries — <a href="mailto:contact@4umg.com">contact@4umg.com</a></p>
</div>

<script>
const phrases = [
  "We connect businesses with the right vendors.",
  "We solve your biggest vendor challenge.",
  "We make the introduction. You get paid.",
  "We sit in the middle so you don't have to."
];
let pi = 0, ci = 0, deleting = false;
const el = document.getElementById('typewriter');

function type() {
  const phrase = phrases[pi];
  if (!deleting) {
    el.textContent = phrase.slice(0, ++ci);
    if (ci === phrase.length) {
      deleting = true;
      setTimeout(type, 2200);
      return;
    }
  } else {
    el.textContent = phrase.slice(0, --ci);
    if (ci === 0) {
      deleting = false;
      pi = (pi + 1) % phrases.length;
    }
  }
  setTimeout(type, deleting ? 40 : 65);
}
type();
</script>
</body>
</html>
